[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtpi"
version = "0.1.0"
description = "Multiscale topographic-position base maps from FABDEM / COP90"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "rasterio>=1.4",
    "matplotlib",
    "whitebox>=2.3",
    "gdal>=3.10",
]

[tool.setuptools.packages.find]
where = ["src"]
